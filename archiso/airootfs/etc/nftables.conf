#!/usr/sbin/nft -f
# safegamingOS — host firewall.
# Default policy: INBOUND = DROP (nothing listens to the network unless the
# user opens it), FORWARD = DROP, OUTBOUND = allow.
# Protects the desktop from network scans/exploits and rooms from inbound
# connections; room egress (browser/games/streaming) works normally.
#
# Open a port later, e.g. SSH:
#   sudo nft add rule inet sg-firewall input tcp dport 22 accept
#   sudo nft list ruleset > /etc/nftables.conf   # persist

flush ruleset

table inet sg-firewall {
    chain input {
        type filter hook input priority filter; policy drop;

        # loopback — всегда
        iif "lo" accept

        # ответы и уже установленные соединения
        ct state established,related accept

        # битые пакеты — сразу в мусор
        ct state invalid drop

        # DHCP-клиент (broadcast-ответы сервера не имеют состояния)
        udp dport 68 accept

        # ICMP: ping/error — работают
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept

        # ICMPv6: обязательные для IPv6 NDP/MLD/error + ping
        meta nfproto ipv6 icmpv6 type {
            destination-unreachable, packet-too-big, time-exceeded,
            parameter-problem, echo-request, echo-reply,
            nd-neighbor-solicit, nd-neighbor-advert,
            nd-router-solicit, nd-router-advert,
            mld-listener-query, mld-listener-report, mld-listener-done
        } accept

        # всё остальное — drop (политика)
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
