# safegamingOS — SDDM: default to the Wayland session.
#
# WHY: on X11 any process in the session can capture the whole screen and
# keylog the entire keyboard (xwd/XTEST/Record) — that would break the core
# promise that a normal room cannot see the screen or keys of other apps.
# On Wayland, screen capture requires an explicit portal approval dialog and
# apps cannot read each other's input. XWayland clients get per-window
# Xauthority cookies, so even X11 apps inside rooms cannot spy globally.
# The X11 session stays available in the login screen as a fallback.

[Autologin]
User=live
Session=plasmawayland
Relogin=false

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
