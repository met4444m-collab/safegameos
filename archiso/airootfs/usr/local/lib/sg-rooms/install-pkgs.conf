# safegamingOS — пакеты, которые инсталлятор ставит на целевой диск.
#
# Это ЕДИНЫЙ источник списка для двух мест:
#   1. sg-install-run — `pacstrap -K "$TARGET" $INSTALL_PKGS` (онлайн);
#   2. customize_airootfs.sh — предзагрузка этого же набора в /opt/sg-offline
#      при сборке ISO (офлайн-установка без интернета).
# Список менять только здесь, чтобы набор в ISO всегда покрывал установку.
INSTALL_PKGS="base linux linux-firmware intel-ucode amd-ucode \
networkmanager iwd plymouth \
plasma-meta plasma-nm plasma-pa sddm sddm-kcm kscreen konsole dolphin kate gwenview spectacle \
xdg-utils xdg-user-dirs xdg-desktop-portal xdg-desktop-portal-kde power-profiles-daemon \
ttf-dejavu noto-fonts noto-fonts-cjk \
pipewire pipewire-pulse pipewire-alsa wireplumber alsa-utils sof-firmware \
mesa libva-intel-driver intel-media-driver vulkan-intel vulkan-radeon \
obs-studio prismlauncher jre-openjdk firefox firejail \
xorg-server xorg-xephyr xorg-xauth xorg-xwayland \
nftables \
sqlite inotify-tools python python-pyqt6 polkit polkit-kde-agent \
apparmor clamav dialog sudo vim git curl wget reflector rsync openssh \
libnotify jq grub efibootmgr acl"
