# safegamingOS — hardening ядра для изоляции комнат.
# Применяется системой при загрузке (systemd-sysctl) в live и установленной ОС.
# Ключи, которых нет в ядре, systemd-sysctl пропускает — загрузка не страдает.

# ===========================================================================
# Процессная изоляция
# ===========================================================================

# 1 = ptrace разрешён только родителю процесса (запрет шпионажа за чужими
# процессами хоста и других комнат через strace/gdb).
kernel.yama.ptrace_scope = 1

# Скрыть адреса ядра от непривилегированных пользователей (/proc/kallsyms).
kernel.kptr_restrict = 1

# Читать журнал ядра (dmesg) может только root — меньше утечек для разведки.
kernel.dmesg_restrict = 1

# 3 = perf-события запрещены полностью (закрывает тайминговые side-channel
# атаки и наблюдение за чужими процессами через perf).
kernel.perf_event_paranoid = 3

# Запретить непривилегированным процессам вызывать bpf(2) (помимо JIT-харднинга).
kernel.unprivileged_bpf_disabled = 1

# Ужесточить JIT-компиляцию eBPF (сложнее эксплойты через BPF).
net.core.bpf_jit_harden = 2

# userfaultfd только для привилегированных — закрывает целый класс
# уязвимостей ядра, эксплуатируемых через userfaultfd.
vm.unprivileged_userfaultfd = 0

# Запретить непривилегированным процессам создавать user namespaces —
# закрывает класс эксплойтов побега из песочниц/контейнеров (нужен AppArmor,
# включён в safegamingOS).
kernel.apparmor_restrict_unprivileged_userns = 1

# ===========================================================================
# Файловая система: защита от гонок (symlink/hardlink, sticky-dir, FIFO)
# ===========================================================================

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Никаких suid-дампов в мир, дампы ядра только в pipe/logind
fs.suid_dumpable = 0
kernel.core_uses_pid = 1

# Загрузка kexec запрещена (нельзя подменить ядро из userspace)
kernel.kexec_load_disabled = 1

# ===========================================================================
# Сеть: анти-спуфинг, синк-куки, запрет редиректов (перехват маршрутов)
# ===========================================================================

net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1

net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Не принимать source-route пакеты (IP-спуфинг через опции маршрута)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
