name: Build ISO

# Builds out/safegamingos-<ver>-x86_64.iso on GitHub's cloud runners
# inside an official Arch Linux container. Run it manually from the
# Actions tab (or push a tag v*).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archiso
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso jq

      # public repos get ~5GB Actions artifact storage; a single ISO is ~1.3GB
      # compressed, so old builds exhaust the quota and the upload starts
      # failing (0.9.6 hit this). The official delete-artifact action removes
      # every previous safegamingos-iso artifact by name, keeping exactly one.
      - name: Prune old ISO artifacts (frees storage quota)
        uses: actions/delete-artifact@v4
        with:
          name: safegamingos-iso
          failOnError: false

      - name: Build ISO
        run: bash ./build_iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: safegamingos-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 30
