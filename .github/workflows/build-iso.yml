name: Build ISO

# Builds out/safegamingos-<ver>-x86_64.iso on GitHub's cloud runners
# inside an official Arch Linux container, plus the auto-update payload
# (safegamingos-files-<ver>.tar.zst), then publishes a GitHub Release
# with both so users can download/auto-update without logging in.
# Run it manually from the Actions tab (or push a tag v*).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archiso
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso jq github-cli

      # public repos get ~5GB Actions artifact storage; since v0.10.0 the ISO
      # bundles the full offline install package set (/opt/sg-offline) and is
      # ~3-4GB compressed, so old builds would exhaust the quota fast and the
      # upload would start failing (0.9.6 hit this with a 1.3GB ISO). The
      # official delete-artifact action removes every previous safegamingos-iso
      # artifact by name, keeping exactly one.
      - name: Prune old ISO artifacts (frees storage quota)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: safegamingos-iso
          failOnError: false

      - name: Build ISO
        run: bash ./build_iso.sh

      - name: Build update payload
        run: |
          VER=$(awk -F'"' '/^ISO_VERSION=/{print $2; exit}' build_iso.sh)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Building update payload for v$VER"
          bash scripts/make-update-payload.sh "$VER" out

      # Релиз = постоянная ссылка для скачивания командой (curl -L ...)
      # и источник для автообновления sg-update (пакеты-слой + ISO).
      # GitHub кладёт в релизы файлы только до 2 ГБ, а ISO ~3 ГБ, поэтому
      # ISO режется на части по 1.4 ГБ + контрольные суммы + инструкция склейки.
      # (sg-update download собирает части сам; вручную: cat / copy /b)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$VER"
          REPO="${{ github.repository }}"
          ISO="$(ls out/safegamingos-*.iso | head -n1)"
          BASE="${ISO%.iso}"
          rm -f "${BASE}".iso.part*
          echo ":: split ${ISO} на части по 1400M"
          split -b 1400M -d -a 2 "${ISO}" "${BASE}.iso.part"
          (cd out && sha256sum "$(basename "${ISO}")") > out/checksums.txt
          BASEB="$(basename "${BASE}")"
          WINCMD="copy /b $(cd out && ls -1 *.iso.part* | tr '\n' '+' | sed 's/+$//') ${BASEB}.iso"
          { echo "safegamingOS v$VER — скачайте ВСЕ части .iso.partNN и склейте:";
            echo "  Linux/macOS: cat ${BASEB}.iso.part* > ${BASEB}.iso";
            echo "  Windows (cmd): ${WINCMD}";
            echo "Проверка: sha256sum -c checksums.txt";
            echo "Автообновление в системе само скачивает и склеивает: sg-update download"; } > out/merge.txt
          ASSETS=(out/safegamingos-files-*.tar.zst "${BASE}".iso.part* out/checksums.txt out/merge.txt)
          if gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "v$VER" "${ASSETS[@]}" --clobber --repo "$REPO"
          else
            gh release create "v$VER" "${ASSETS[@]}" \
              --repo "$REPO" \
              --title "safegamingOS $VER" \
              --notes "Автосборка safegamingOS v$VER — ISO (частями, из-за лимита 2 ГБ на файл) + слой обновления для sg-update."
          fi

      # if: always() — ISO-артефакт сохраняется даже если публикация релиза
      # упала (чтобы сборку не приходилось переделывать целиком).
      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safegamingos-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 30
